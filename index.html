<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKITA</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0c0c10;
  --dot:       rgba(255,255,255,0.07);
  --ring:      rgba(255,255,255,0.055);
  --ptcl:      rgba(255,255,255,0.28);
  --text:      #f0eeec;
  --dim:       rgba(240,238,236,0.32);
  --btn-bg:    #f0eeec;
  --btn-fg:    #0c0c10;
  --btn-spot:  rgba(255,255,255,0.55);
  --glow-a:    rgba(230,225,215,0.22);
  --glow-b:    rgba(230,225,215,0.06);
  --bdg-bg:    rgba(255,255,255,0.07);
  --bdg-bd:    rgba(255,255,255,0.11);
  --scrim:     rgba(0,0,0,0.65);
  --card-bg:   #111118;
  --card-bd:   rgba(255,255,255,0.09);
  --T: 0.8s;
}
body.morning {
  --bg:       #faf8f4;
  --dot:      rgba(0,0,0,0.055);
  --ring:     rgba(0,0,0,0.042);
  --ptcl:     rgba(0,0,0,0.18);
  --text:     #1a1a1a;
  --dim:      rgba(26,26,26,0.35);
  --btn-bg:   #1a1a1a;
  --btn-fg:   #faf8f4;
  --btn-spot: rgba(255,255,255,0.22);
  --glow-a:   rgba(20,20,20,0.11);
  --glow-b:   rgba(20,20,20,0.04);
  --bdg-bg:   rgba(0,0,0,0.05);
  --bdg-bd:   rgba(0,0,0,0.09);
  --scrim:    rgba(0,0,0,0.42);
  --card-bg:  #f4f1ed;
  --card-bd:  rgba(0,0,0,0.09);
}
body.day {
  --bg:       #f2f0ec;
  --dot:      rgba(0,0,0,0.055);
  --ring:     rgba(0,0,0,0.04);
  --ptcl:     rgba(0,0,0,0.18);
  --text:     #1a1a1a;
  --dim:      rgba(26,26,26,0.35);
  --btn-bg:   #1a1a1a;
  --btn-fg:   #f2f0ec;
  --btn-spot: rgba(255,255,255,0.22);
  --glow-a:   rgba(20,20,20,0.1);
  --glow-b:   rgba(20,20,20,0.04);
  --bdg-bg:   rgba(0,0,0,0.05);
  --bdg-bd:   rgba(0,0,0,0.09);
  --scrim:    rgba(0,0,0,0.4);
  --card-bg:  #ece9e4;
  --card-bd:  rgba(0,0,0,0.09);
}
body.evening {
  --bg:       #0e0c18;
  --dot:      rgba(150,110,255,0.1);
  --ring:     rgba(150,110,255,0.07);
  --ptcl:     rgba(190,150,255,0.35);
  --text:     #ede9ff;
  --dim:      rgba(237,233,255,0.36);
  --btn-bg:   #ede9ff;
  --btn-fg:   #0e0c18;
  --btn-spot: rgba(255,255,255,0.45);
  --glow-a:   rgba(160,120,255,0.24);
  --glow-b:   rgba(160,120,255,0.08);
  --bdg-bg:   rgba(160,120,255,0.09);
  --bdg-bd:   rgba(160,120,255,0.15);
  --scrim:    rgba(0,0,0,0.7);
  --card-bg:  #13102a;
  --card-bd:  rgba(160,120,255,0.12);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Geist',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  transition:background var(--T) ease,color var(--T) ease;
  cursor:none;
}

@media(pointer:coarse){
  html,body{cursor:auto;}
  #cur{display:none;}
}

/* CURSOR */
#cur{
  position:fixed;width:8px;height:8px;
  border-radius:50%;
  background:var(--text);
  pointer-events:none;z-index:9999;
  transform:translate(-50%,-50%);
  mix-blend-mode:difference;
  opacity:0;
  transition:width .18s,height .18s,opacity .15s;
}
#cur.on{opacity:1;}
#cur.big{width:34px;height:34px;}

/* CELESTIAL */
#sky{
  position:fixed;border-radius:50%;
  filter:blur(65px);
  pointer-events:none;z-index:0;
  transition:opacity 2.5s ease,filter 2.5s ease,background 2.5s ease;
}

/* DOT GRID */
.grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,var(--dot) 1.5px,transparent 1.5px);
  background-size:64px 64px;
  transition:background-image var(--T);
}

/* BG SHAPES */
.shapes{
  position:fixed;inset:0;z-index:0;
  pointer-events:none;overflow:hidden;
}
.ring{
  position:absolute;border-radius:50%;
  border:1px solid var(--ring);
  animation:floatR ease-in-out infinite;
  transition:border-color var(--T);
}
.px{
  position:absolute;border-radius:50%;
  background:var(--ptcl);
  animation:floatP ease-in-out infinite;
  transition:background var(--T);
}
@keyframes floatR{
  0%,100%{transform:translate(0,0) rotate(0deg);}
  33%{transform:translate(14px,-18px) rotate(4deg);}
  66%{transform:translate(-9px,11px) rotate(-3deg);}
}
@keyframes floatP{
  0%,100%{transform:translate(0,0);opacity:.35;}
  50%{transform:translate(-7px,-13px);opacity:.85;}
}

/* BADGE */
.badge{
  position:fixed;top:18px;right:18px;z-index:10;
  display:flex;align-items:center;gap:7px;
  background:var(--bdg-bg);border:1px solid var(--bdg-bd);
  border-radius:20px;padding:7px 14px;
  font-size:12px;font-weight:400;
  color:var(--dim);letter-spacing:.02em;
  backdrop-filter:blur(12px);
  transition:background var(--T),border-color var(--T),color var(--T);
  opacity:0;animation:up .7s ease .9s forwards;
}
.bdot{
  width:5px;height:5px;border-radius:50%;
  background:var(--dim);
  animation:blink 2.4s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:.25;}50%{opacity:1;}}

/* PAGE */
.page{
  position:relative;z-index:2;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}

/* NAME — заголовок, больше support, меньше donate */
.name{
  font-size:28px;font-weight:600;
  letter-spacing:0.15em;
  text-transform:uppercase;
  color:var(--text);
  margin-bottom:32px;
  opacity:0;animation:up .8s cubic-bezier(.16,1,.3,1) .1s forwards;
  transition:color var(--T);
}

/* DONATE WRAP */
.dwrap{
  position:relative;
  margin-bottom:24px;
  opacity:0;animation:up .8s cubic-bezier(.16,1,.3,1) .22s forwards;
}

/* GLOW — усиленное свечение вокруг кнопки */
.glow{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:180%;height:280%;
  border-radius:50%;
  background:radial-gradient(ellipse at center,
    var(--glow-a) 0%,var(--glow-b) 35%,transparent 70%);
  pointer-events:none;z-index:-1;
  animation:breathe 4s ease-in-out infinite;
  transition:background var(--T);
  opacity:0.9;
}
@keyframes breathe{
  0%,100%{opacity:0.7;transform:translate(-50%,-50%) scale(1);}
  50%{opacity:1;transform:translate(-50%,-50%) scale(1.12);}
}

/* DONATE BUTTON */
.dbtn{
  --mx:50%;--my:50%;
  position:relative;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:24px 72px;min-width:340px;
  background:var(--btn-bg);color:var(--btn-fg);
  border:none;border-radius:100px;
  font-family:inherit;font-size:20px;font-weight:500;
  letter-spacing:-.01em;
  text-decoration:none;cursor:none;overflow:hidden;
  transition:background var(--T),color var(--T),
             transform .25s cubic-bezier(.34,1.56,.64,1),
             box-shadow .3s ease;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
}
.dbtn svg{width:18px;height:18px;flex-shrink:0;}

/* Inner spotlight strictly on button */
.dbtn::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle 100px at var(--mx) var(--my),
    var(--btn-spot) 0%,transparent 65%);
  opacity:0;
  transition:opacity .22s ease;
  border-radius:inherit;pointer-events:none;
}
.dbtn:hover::after{opacity:1;}
.dbtn:hover{transform:scale(1.03) translateY(-2px);box-shadow: 0 12px 40px rgba(0,0,0,0.2);}
.dbtn:active{transform:scale(.97);transition-duration:.1s;}

/* SUPPORT BUTTON — стиль как на фото 4 */
.swrap{
  opacity:0;animation:up .8s cubic-bezier(.16,1,.3,1) .36s forwards;
}
.sbtn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--bdg-bg);border:1px solid var(--bdg-bd);
  border-radius:12px;padding:10px 18px;
  font-family:inherit;font-size:13px;font-weight:400;
  color:var(--dim);cursor:none;
  letter-spacing:.02em;transition:all .25s ease;
  backdrop-filter:blur(8px);
}
.sbtn:hover{
  color:var(--text);
  background:rgba(255,255,255,0.12);
  border-color:rgba(255,255,255,0.2);
  transform:translateY(-1px);
}
.sbtn svg{width:14px;height:14px;opacity:0.7;}

/* MODAL */
.modal{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  opacity:0;pointer-events:none;
  transition:opacity .38s cubic-bezier(.16,1,.3,1);
}
.modal.open{opacity:1;pointer-events:all;}

.mscrim{
  position:absolute;inset:0;
  background:var(--scrim);
  backdrop-filter:blur(0px);
  -webkit-backdrop-filter:blur(0px);
  transition:backdrop-filter .4s ease,background var(--T);
}
.modal.open .mscrim{
  backdrop-filter:blur(32px);
  -webkit-backdrop-filter:blur(32px);
}

.mcard{
  position:relative;
  background:var(--card-bg);border:1px solid var(--card-bd);
  border-radius:24px;padding:26px 24px 22px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  max-width:285px;width:100%;
  transform:scale(.88) translateY(20px);
  transition:transform .45s cubic-bezier(.34,1.56,.64,1),
             background var(--T),border-color var(--T);
  box-shadow:0 30px 80px rgba(0,0,0,.35);
}
.modal.open .mcard{transform:scale(1) translateY(0);}

.qlabel{
  font-size:11px;color:var(--dim);
  letter-spacing:.06em;text-transform:uppercase;
  transition:color var(--T);
}
.qwrap{
  width:210px;height:210px;border-radius:14px;
  overflow:hidden;background:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.qwrap img{width:100%;height:100%;object-fit:cover;display:block;}
.qwrap .qr-placeholder{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;
  color:#999;font-size:12px;
}
.mhint{
  font-size:11px;color:var(--dim);opacity:.65;
  transition:color var(--T);
}

/* МОЛОДЕЦ — celebration overlay */
.celebration{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  background:var(--scrim);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  opacity:0;
  pointer-events:none;
  transition:opacity .5s ease, background var(--T);
}
.celebration.show{opacity:1;pointer-events:all;}
.celebration-text{
  font-size:72px;font-weight:600;
  letter-spacing:0.2em;
  color:var(--text);
  text-transform:uppercase;
  animation:celebrateIn .8s cubic-bezier(.34,1.56,.64,1) forwards,
            celebratePulse 2s ease-in-out infinite .8s;
  text-shadow: 0 0 60px var(--glow-a), 0 0 120px var(--glow-b);
}
@keyframes celebrateIn{
  from{opacity:0;transform:scale(0.5) translateY(30px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}
@keyframes celebratePulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.05);}
}

/* Confetti particles */
.confetti-container{
  position:fixed;inset:0;z-index:199;
  pointer-events:none;overflow:hidden;
}
.confetti{
  position:absolute;width:8px;height:8px;
  border-radius:2px;opacity:0;
  animation:confettiFall 3s ease-out forwards;
}
@keyframes confettiFall{
  0%{opacity:1;transform:translateY(-20px) rotate(0deg);}
  100%{opacity:0;transform:translateY(100vh) rotate(720deg);}
}

@keyframes up{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<script>
/* CURSOR */
const cur = document.getElementById('cur');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
  cur.classList.add('on');
});
document.addEventListener('mouseleave', () => cur.classList.remove('on'));
document.querySelectorAll('a,button').forEach(el => {
  el.addEventListener('mouseenter', () => cur.classList.add('big'));
  el.addEventListener('mouseleave', () => cur.classList.remove('big'));
});

/* BUTTON SPOTLIGHT */
const dbtn = document.getElementById('dbtn');
dbtn.addEventListener('mousemove', e => {
  const r = dbtn.getBoundingClientRect();
  dbtn.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  dbtn.style.setProperty('--my', (e.clientY - r.top)  + 'px');
});

/* FLOATING SHAPES */
const shapes = document.getElementById('shapes');
const rings = [
  [140, 6, 12, 22, 0], [88, 78, 55, 18, -4], [175, 15, 65, 26, -8],
  [68, 55, 10, 14, -2], [118, 85, 22, 20, -6], [98, 38, 78, 24,-12],
];
rings.forEach(([w,l,t,dur,del]) => {
  const d = document.createElement('div');
  d.className = 'ring';
  d.style.cssText = `width:${w}px;height:${w}px;left:${l}%;top:${t}%;animation-duration:${dur}s;animation-delay:${del}s`;
  shapes.appendChild(d);
});
for (let i = 0; i < 28; i++) {
  const d = document.createElement('div');
  d.className = 'px';
  const s = 2 + Math.random() * 2.5;
  d.style.cssText = `width:${s}px;height:${s}px;left:${5+Math.random()*88}%;top:${5+Math.random()*88}%;animation-duration:${7+Math.random()*14}s;animation-delay:${-Math.random()*14}s`;
  shapes.appendChild(d);
}

/* CELESTIAL */
const sky = document.getElementById('sky');
const skyMap = {
  night:   ['radial-gradient(circle,rgba(210,225,255,.75) 0%,rgba(155,185,255,.35) 35%,transparent 65%)','260px','260px','-40px','','' ,'-40px'],
  morning: ['radial-gradient(circle,rgba(255,215,90,.85) 0%,rgba(255,158,45,.45) 35%,transparent 65%)',  '430px','430px','','-90px','','-90px'],
  day:     ['radial-gradient(circle,rgba(255,250,200,.9) 0%,rgba(255,218,80,.5)  35%,transparent 65%)',  '500px','290px','-65px','','',''],
  evening: ['radial-gradient(circle,rgba(255,108,58,.72) 0%,rgba(255,48,88,.36) 35%,transparent 65%)',   '360px','360px','','-55px','-55px',''],
};
function setCelestial(p) {
  const [bg,w,h,top,right,bottom,left] = skyMap[p] || skyMap.night;
  Object.assign(sky.style, {
    background:bg, width:w, height:h,
    top:top||'', right:right||'', bottom:bottom||'', left:left||'',
    transform: p === 'day' ? 'translateX(-50%)' : '',
    opacity: p === 'night' ? '.7' : p === 'day' ? '.62' : '.72',
  });
}

/* MOSCOW TIME THEME */
function msHour() {
  const d = new Date();
  return new Date(d.getTime() + d.getTimezoneOffset()*60000 + 3*3600000).getHours();
}
const themes = {
  night:   {cls:'',        txt:'🌙 Москва · ночь'},
  morning: {cls:'morning', txt:'🌅 Москва · утро'},
  day:     {cls:'day',     txt:'☀️ Москва · день'},
  evening: {cls:'evening', txt:'🌆 Москва · вечер'},
};
function applyTheme() {
  const h = msHour();
  const p = h>=6&&h<12 ? 'morning' : h>=12&&h<18 ? 'day' : h>=18&&h<23 ? 'evening' : 'night';
  document.body.className = themes[p].cls;
  document.getElementById('btxt').textContent = themes[p].txt;
  setCelestial(p);
}
applyTheme();
setInterval(applyTheme, 60000);

/* QR MODAL */
const modal = document.getElementById('modal');
const mcard = document.getElementById('mcard');
document.getElementById('sbtn').addEventListener('click', () => modal.classList.add('open'));
modal.addEventListener('click', e => { if (!mcard.contains(e.target)) modal.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key==='Escape') modal.classList.remove('open'); });

/* МОЛОДЕЦ — показать при возврате с доната */
function showCelebration() {
  const cel = document.getElementById('celebration');
  const conf = document.getElementById('confetti');

  // Create confetti
  const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#f0932b', '#eb4d4b', '#6c5ce7', '#a29bfe'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-10px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (4 + Math.random() * 8) + 'px';
    c.style.height = (4 + Math.random() * 8) + 'px';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.animationDelay = (Math.random() * 2) + 's';
    c.style.animationDuration = (2 + Math.random() * 3) + 's';
    conf.appendChild(c);
  }

  cel.classList.add('show');

  // Hide after 3 seconds
  setTimeout(() => {
    cel.classList.remove('show');
    conf.innerHTML = '';
  }, 3500);
}

// Check if returning from donation (using visibility API or session)
if (document.visibilityState === 'visible' && sessionStorage.getItem('donated')) {
  sessionStorage.removeItem('donated');
  showCelebration();
}

// Mark when leaving for donation
dbtn.addEventListener('click', () => {
  sessionStorage.setItem('donated', 'true');
});

// Also check on visibility change (when user comes back)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && sessionStorage.getItem('donated')) {
    sessionStorage.removeItem('donated');
    showCelebration();
  }
});
</script>
